[project]
name = "k8s-agent-gateway"
version = "0.1.0"
description = "Read-only lab-information MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
	"mcp==1.30.0",
	"httpx>=0.28,<1",
	"pydantic>=2.11,<3",
	"starlette>=0.40,<1",
	"uvicorn>=0.31,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]

[[tool.uv.index]]
name = "approved"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true
